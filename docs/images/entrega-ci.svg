<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">Automatización de CI y publicación</title>
  <desc id="desc">Dos flujos automatizados: CI para cambios de código y publicación mensual de datos; ambos bloquean la entrega cuando las validaciones fallan.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52716d"/></marker><style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172a35}.eyebrow{font-size:15px;font-weight:700;letter-spacing:2px;fill:#16877c}.title{font-size:34px;font-weight:750}.sub{font-size:17px;fill:#52616b}.head{font-size:20px;font-weight:700}.body{font-size:14px;fill:#435761}.small{font-size:13px;fill:#52616b}.box{fill:#fff;stroke:#d6e2de;stroke-width:2}.line{stroke:#52716d;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style></defs>
  <rect width="1440" height="780" fill="#f5f8f6"/>
  <text x="64" y="58" class="eyebrow">CITYTRIPS NYC · AUTOMATIZACIÓN</text>
  <text x="64" y="108" class="title">Dos workflows, una misma regla: cerrar la puerta si falla un control</text>
  <text x="64" y="141" class="sub">CI valida cambios frecuentes; el refresh reconstruye el conjunto completo antes de publicarlo.</text>
  <rect x="64" y="190" width="1312" height="230" rx="20" fill="#edf2f8" stroke="#cbd8e6" stroke-width="2"/>
  <text x="92" y="231" class="head">CI · push / pull request a main</text>
  <g transform="translate(92 267)"><rect width="230" height="101" rx="14" class="box"/><text x="22" y="43" class="head" style="font-size:17px">Python</text><text x="22" y="71" class="body">ruff + pytest</text></g>
  <g transform="translate(374 267)"><rect width="230" height="101" rx="14" class="box"/><text x="22" y="43" class="head" style="font-size:17px">dbt / DuckDB</text><text x="22" y="71" class="body">modelos + contratos</text></g>
  <g transform="translate(656 267)"><rect width="230" height="101" rx="14" class="box"/><text x="22" y="43" class="head" style="font-size:17px">Frontend</text><text x="22" y="71" class="body">npm lint + tests + build</text></g>
  <g transform="translate(1010 267)"><rect width="312" height="101" rx="14" fill="#def1e8" stroke="#b8decf" stroke-width="2"/><text x="24" y="43" class="head" style="font-size:17px">Solo cambios válidos</text><text x="24" y="71" class="body">quedan listos para integrar</text></g>
  <path d="M322 317 H366" class="line"/><path d="M604 317 H648" class="line"/><path d="M886 317 H1002" class="line"/>
  <rect x="64" y="454" width="1312" height="238" rx="20" fill="#f2edf7" stroke="#d9cbe8" stroke-width="2"/>
  <text x="92" y="495" class="head">Publicación · schedule mensual o disparo manual</text>
  <g transform="translate(92 530)"><rect width="205" height="112" rx="14" class="box"/><text x="18" y="39" class="head" style="font-size:17px">1 · Refresh</text><text x="18" y="69" class="body">descarga y verifica</text><text x="18" y="91" class="body">la ventana de meses</text></g>
  <g transform="translate(333 530)"><rect width="205" height="112" rx="14" class="box"/><text x="18" y="39" class="head" style="font-size:17px">2 · dbt build</text><text x="18" y="69" class="body">modelos, tests y</text><text x="18" y="91" class="body">reconciliación</text></g>
  <g transform="translate(574 530)"><rect width="205" height="112" rx="14" class="box"/><text x="18" y="39" class="head" style="font-size:17px">3 · Frontend</text><text x="18" y="69" class="body">lint, tests, build</text><text x="18" y="91" class="body">con ruta de Pages</text></g>
  <g transform="translate(815 530)"><rect width="205" height="112" rx="14" class="box"/><text x="18" y="39" class="head" style="font-size:17px">4 · Artefacto</text><text x="18" y="69" class="body">JSON + GeoJSON</text><text x="18" y="91" class="body">empaquetados</text></g>
  <g transform="translate(1056 530)"><rect width="266" height="112" rx="14" fill="#def1e8" stroke="#b8decf" stroke-width="2"/><text x="18" y="39" class="head" style="font-size:17px">5 · GitHub Pages</text><text x="18" y="69" class="body">deploy tras éxito</text><text x="18" y="91" class="body">permisos acotados</text></g>
  <path d="M297 586 H325" class="line"/><path d="M538 586 H566" class="line"/><path d="M779 586 H807" class="line"/><path d="M1020 586 H1048" class="line"/>
  <text x="92" y="669" class="small">Si un paso falla: no se crea el artefacto nuevo y no se ejecuta el job deploy; Pages conserva el último resultado exitoso.</text>
</svg>
